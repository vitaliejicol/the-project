name: TBD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API Service
        run: docker build -t myapp-api:${{ github.sha }} -f ./application/api/Dockerfile .

      - name: Build Worker Service
        run: docker build -t myapp-worker:${{ github.sha }} -f ./application/worker/Dockerfile .
      
      - name: Build Frontend Service
        run: docker build -t myapp-frontend:${{ github.sha }} -f ./application/frontend/Dockerfile .
      
      # - name: Run Test
      #   run: ./runt-tests.sh
      
      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
      
      - name: Save image info
        run: |
          echo "API_IMAGE=myapp-api:${{ github.sha }}" >> $GITHUB_ENV
          echo "WORKER_IMAGE=myapp-worker:${{ github.sha }}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=myapp-frontend:${{ github.sha }}" >> $GITHUB_ENV
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: "${{ secrets.AWS_ROLE_ARN }}"
          aws-region: "${{ secrets.AWS_REGION }}"

      - name: Fetch all tags
        run: git fetch --tags

      - name: Calculate Semantic Version
        id: semver
        run: |
          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1)) || echo "0.0.0")
          VERSION=${LATEST_TAG}
          COMITS=$(git log $LATEST_TAG..HEAD --pretty=format:"%s")

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if echo "$COMITS" | grep -q "BREAKING CHANGE"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMITS" | grep -q "feat"; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif echo "$COMITS" | grep -q "fix"; then
            PATCH=$((PATCH + 1))
          fi

          NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "APP_VERSION=$NEXT_VERSION" >> $GITHUB_ENV
          echo "Calculated next version: $NEXT_VERSION"

          - name: Tag and Push Docker Images
            run: |
              docker tag myapp-api:${{ github.sha }} myapp-api:${{ env.APP_VERSION }}
              docker tag myapp-worker:${{ github.sha }} myapp-worker:${{ env.APP_VERSION }}
              docker tag myapp-frontend:${{ github.sha }} myapp-frontend:${{ env.APP_VERSION }}
              docker push myapp-api:${{ env.APP_VERSION }}
              docker push myapp-worker:${{ env.APP_VERSION }}
              docker push myapp-frontend:${{ env.APP_VERSION }}
          
          - name: Create Git Tag
            run: |
              git tag -a v${{ env.APP_VERSION }} -m "Release version ${{ env.APP_VERSION }}"
              git push origin v${{ env.APP_VERSION }}

                                                                                                                                                                                                                                                                                                                                  