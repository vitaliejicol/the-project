name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      APP_VERSION: ${GITHUB_REF#refs/tags/v}

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "APP_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Debug version
        run: echo "APP_VERSION=$APP_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ########################################
      # API SERVICE
      ########################################
      - name: Build and Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./application/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      ########################################
      # WORKER SERVICE
      ########################################
      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./application/worker/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/myapp-worker:${{ env.APP_VERSION }}
            ${{ steps.login-ecr.outputs.registry }}/myapp-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      ########################################
      # FRONTEND SERVICE
      ########################################
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./application/frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/myapp-frontend:${{ env.APP_VERSION }}
            ${{ steps.login-ecr.outputs.registry }}/myapp-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max