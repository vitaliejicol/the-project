name: Build|Push|Dev

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  workflow_dispatch:
    inputs:
        service:
          description: "Select service to build"
          required: true
          type: choice
          options:
            - api
            - worker
            - frontend

jobs:
  TBA:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  TBD:
    runs-on: ubuntu-latest
    needs: TBA
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  build-push:
    runs-on: ubuntu-latest
    needs: TBD
    permissions:
      id-token: write
      contents: read  

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: set-version
        run: |
          SHORT_SHA=${GITHUB_SHA::7}

          if [ -n "${{ inputs.image_tag }}" ]; then
            VERSION="${{ inputs.image_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            SAFE_BRANCH=$(echo "$BRANCH_NAME" | tr '/' '-')
            VERSION="$SAFE_BRANCH-$SHORT_SHA"
          fi

          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Debug version
        run: echo "APP_VERSION=$APP_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ########################################
      # API SERVICE
      ########################################
      - name: Debug registry
        run: |
            echo "Registry value: '${{ steps.login-ecr.outputs.registry }}'"
            
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./application/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.service}}:${{ env.APP_VERSION }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.service}}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
